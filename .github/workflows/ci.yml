name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    # Runs in the same container as the release job rather than on
    # ubuntu-latest: walllust-renderer needs gtk4-layer-shell, and
    # ubuntu-latest has no libgtk4-layer-shell-dev package at all.
    container: debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq build-essential curl ca-certificates git \
            pkg-config clang libclang-dev libwayland-dev libxkbcommon-dev \
            libegl1-mesa-dev libfontconfig1-dev libgtk-4-dev \
            libgtk4-layer-shell-dev libwebkitgtk-6.0-dev libavutil-dev \
            libavcodec-dev libavformat-dev libswscale-dev libavdevice-dev \
            libavfilter-dev libpostproc-dev libswresample-dev \
            desktop-file-utils

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true

      - name: Build release
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked --bin walllust-daemon

      - name: Validate desktop entry
        run: desktop-file-validate walllust.desktop
